<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fotoklubassvetaine.blazorclient</title>
    <base href="/" />

    <!-- CSS failai -->
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link href="fotoklubassvetaine.blazorclient.styles.css" rel="stylesheet" />

    <!-- TUI Image Editor CSS -->
    <link rel="stylesheet" href="https://uicdn.toast.com/tui-image-editor/latest/tui-image-editor.min.css" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>

    <!-- TUI Image Editor dependencies -->
    <script src="https://uicdn.toast.com/tui.code-snippet/latest/tui-code-snippet.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/4.6.0/fabric.min.js"></script>
    <script src="https://uicdn.toast.com/tui-image-editor/latest/tui-image-editor.min.js"></script>

    <!-- JS Blazor function -->
    <script>
        function openEditor(imageUrl, dotNetHelper) {
            const container = document.getElementById('editor-container');
            if (!container) {
                console.error("❌ editor-container not found!");
                return;
            }

            container.innerHTML = '';

            const imageEditor = new tui.ImageEditor(container, {
                includeUI: {
                    loadImage: {
                        path: imageUrl,
                        name: 'image'
                    },
                    theme: {},
                    menu: ['crop', 'flip', 'rotate', 'draw', 'shape', 'icon', 'text', 'filter'],
                    initMenu: 'filter',
                    uiSize: {
                        width: '100%',
                        height: '600px'
                    },
                    menuBarPosition: 'bottom'
                },
                cssMaxWidth: 700,
                cssMaxHeight: 500,
                selectionStyle: {
                    cornerSize: 20,
                    rotatingPointOffset: 70
                }
            });

            // Save button callback
            document.getElementById('save-image-btn')?.addEventListener('click', () => {
                const dataUrl = imageEditor.toDataURL();
                dotNetHelper.invokeMethodAsync("OnImageEdited", dataUrl);
            });


        }
    </script>

    <script>
        function scrollToBottom(elementId) {
            var element = document.getElementById(elementId);
            if (element) {
                element.scrollTop = element.scrollHeight;
            }
        }
    </script>

</body>

</html>
